name: Validate Stadtkyll

on:
  push:
    branches: [main, region2-bootstrap]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate region JSON
        run: python -m json.tool data/region.json > /dev/null
      - name: Validate places JSON
        run: python -m json.tool data/places.json > /dev/null
      - name: Verify required files
        run: test -f index.html && test -f styles.css && test -f manifest.webmanifest && test -f icon.svg
