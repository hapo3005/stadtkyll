name: Validate Stadtkyll

on:
  push:
    branches:
      - main
      - 'region2-*'
      - 'quality-*'
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check photos.js
          node --check quality-v04.js
          node --check scripts/validate-data.mjs
      - name: Validate JSON syntax
        run: |
          python -m json.tool data/region.json > /dev/null
          python -m json.tool data/places.json > /dev/null
      - name: Validate regional data contract
        run: node scripts/validate-data.mjs
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f map.css
          test -f photos.css
          test -f quality-v04.css
          test -f manifest.webmanifest
          test -f icon.svg
