name: Validate Stadtkyll

on:
  push:
    branches:
      - main
      - 'region2-*'
      - 'quality-*'
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check photos.js
          node --check quality-v04.js
          node --check quality-v08.js
          node --check quality-v09.js
          node --check quality-v012.js
          node --check region25.js
          node --check region25-ui.js
          node --check region25-photos.js
          node --check scripts/validate-data.mjs
          node --check scripts/validate-25km.mjs
      - name: Validate JSON syntax
        run: |
          python -m json.tool data/region.json > /dev/null
          python -m json.tool data/places.json > /dev/null
          python -m json.tool data/places-25km.json > /dev/null
          python -m json.tool data/places-25km-more.json > /dev/null
          python -m json.tool data/places-25km-extra.json > /dev/null
          python -m json.tool data/places-25km-special.json > /dev/null
          python -m json.tool data/places-25km-moto-dog.json > /dev/null
          python -m json.tool data/places-25km-depth.json > /dev/null
          python -m json.tool data/places-25km-v011.json > /dev/null
          python -m json.tool data/places-25km-v012.json > /dev/null
      - name: Validate regional data contracts
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-25km.mjs
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f map.css
          test -f photos.css
          test -f quality-v04.css
          test -f quality-v012.css
          test -f quality-v08.js
          test -f quality-v09.js
          test -f quality-v012.js
          test -f region25.js
          test -f region25-ui.js
          test -f region25-photos.js
          test -f data/places-25km.json
          test -f data/places-25km-more.json
          test -f data/places-25km-extra.json
          test -f data/places-25km-special.json
          test -f data/places-25km-moto-dog.json
          test -f data/places-25km-depth.json
          test -f data/places-25km-v011.json
          test -f data/places-25km-v012.json
          test -f manifest.webmanifest
          test -f icon.svg
