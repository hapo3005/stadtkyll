name: Deploy HOY Stadtkyll Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate app before deploy
        run: |
          node --check app.js
          node --check photos.js
          python -m json.tool data/region.json > /dev/null
          python -m json.tool data/places.json > /dev/null
          node scripts/validate-data.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css map.css photos.css app.js photos.js manifest.webmanifest icon.svg _site/
          cp data/region.json data/places.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
