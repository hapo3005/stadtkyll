name: Deploy HOY Stadtkyll Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate app before deploy
        run: |
          node --check app.js
          node --check events.js
          node --check photos.js
          node --check quality-v04.js
          node --check quality-v08.js
          node --check quality-v09.js
          node --check quality-v012.js
          node --check region25.js
          node --check region25-ui.js
          node --check region25-photos.js
          python -m json.tool data/region.json > /dev/null
          python -m json.tool data/events.json > /dev/null
          python -m json.tool data/places.json > /dev/null
          python -m json.tool data/places-25km.json > /dev/null
          python -m json.tool data/places-25km-more.json > /dev/null
          python -m json.tool data/places-25km-extra.json > /dev/null
          python -m json.tool data/places-25km-special.json > /dev/null
          python -m json.tool data/places-25km-moto-dog.json > /dev/null
          python -m json.tool data/places-25km-depth.json > /dev/null
          python -m json.tool data/places-25km-v011.json > /dev/null
          python -m json.tool data/places-25km-v012.json > /dev/null
          node scripts/validate-data.mjs
          node scripts/validate-25km.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css map.css photos.css events.css quality-v04.css quality-v012.css quality-v08.js quality-v09.js quality-v012.js events.js app.js photos.js quality-v04.js region25.js region25-ui.js region25-photos.js manifest.webmanifest icon.svg _site/
          cp data/region.json data/events.json data/places.json data/places-25km.json data/places-25km-more.json data/places-25km-extra.json data/places-25km-special.json data/places-25km-moto-dog.json data/places-25km-depth.json data/places-25km-v011.json data/places-25km-v012.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
